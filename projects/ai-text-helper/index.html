    <noscript><main class="no-script-case"><a href="/">sl4dk1y</a><p>AI ENGINEERING · LEARNING EXPERIMENT</p><h1>AI Text Helper</h1><p>A Python API prototype for improving and summarizing Russian text with an LLM and lexical search for known corrections.</p><h2>Approach</h2><p>FastAPI routes each request to the selected task. Text improvement can first look up known corrections with BM25, then call a local model through LiteLLM and Ollama.</p><h2>Validation and limits</h2><p>The repository includes tests for the API, prompts, agent behavior and retriever. It also includes retrieval-evaluation and Locust scripts. These do not establish production reliability or measured end-to-end quality.</p><p>The repository includes a LoRA training script, but no reproducible validation report or published adapter demonstrates a quality gain. Fine-tuning remains an experiment; this is not a production-ready project.</p><a href="https://github.com/sl4dk1y/AI-Text-Helper" rel="noreferrer noopener">View public repository ↗</a></main></noscript>
