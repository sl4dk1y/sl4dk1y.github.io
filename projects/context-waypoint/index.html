        <h1>Context Waypoint</h1>
        <p>A Markdown convention and agent skill that help carry concise project state and handoffs between work sessions.</p>
        <h2>Problem</h2>
        <p>In a long task, decisions, constraints and next steps can get buried in chat history. A short project record gives the next session a clear starting point.</p>
        <h2>Approach</h2>
        <p>The skill keeps a short Markdown record in the project. A new session reads the current state and essential constraints first, then follows only links relevant to its task.</p>
        <h2>Process</h2>
        <ol class="no-script-context-flow">
          <li>Capture verified state</li>
          <li>Save project-local Markdown</li>
          <li>Read current state and constraints</li>
          <li>Follow relevant references</li>
          <li>Resume or hand off work</li>
        </ol>
        <h2>Engineering decisions and limits</h2>
        <p>Records live in a project-local <code>.context-waypoint/</code> directory. The format uses Markdown and does not require a database, daemon, cloud service or model-specific history. Current source and repository rules take precedence over stale context.</p>
        <p>The local project includes the skill definition, operating model, record schema, reusable templates and a fictional Parcel Tracker example. It has no automated tests or end-to-end agent evaluation.</p>
        <h2>Repository</h2>
        <p><a href="https://github.com/sl4dk1y/Context-Waypoint" rel="noreferrer noopener">Open the GitHub repository ↗</a></p>
        <p>The public repository includes the README, Agent Skill, templates, documentation and a project example. Context Waypoint is a Markdown convention and reusable skill. It is not a CLI or hosted platform.</p>
