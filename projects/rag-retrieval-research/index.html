    <noscript><main class="no-script-case"><a href="/">sl4dk1y</a><p>RETRIEVAL STUDY</p><h1>RAG Retrieval Research</h1><p>A Russian-language Mr. TyDi retrieval study with an evaluation on the original 9.6-million-document corpus and a separate reduced-collection comparison.</p><h2>Reduced-collection TEST</h2><p>On 995 TEST queries, BGE-M3 scored Recall@10 0.861307 and nDCG@10 0.692026. E5 scored 0.813065 and 0.641458.</p><h2>Interpretation</h2><p>The one-million-document collection was built partly from positive TEST qrels and historical retrieval runs. Results are conditional on that collection and do not establish performance on the full corpus. The public repository preserves the metrics, runs and protocol.</p><a href="https://github.com/sl4dk1y/rag-retrieval-research" rel="noreferrer noopener">View public repository ↗</a></main></noscript>
