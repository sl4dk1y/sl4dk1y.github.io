        <h1>Human Writing</h1>
        <p>An Agent Skill for editing prose to sound natural while preserving its meaning, facts and the writer’s voice.</p>
        <h2>Problem</h2>
        <p>Generated prose can rely on stock phrases, uniform rhythm and claims that sound more certain than the evidence. A word blacklist does not address those habits.</p>
        <h2>Approach</h2>
        <p>The skill guides an agent through editing for specific facts, clear claims and varied rhythm while preserving meaning. SKILL.md links to focused references and examples.</p>
        <h2>Process</h2>
        <ol class="no-script-context-flow">
          <li>Source text</li><li>SKILL.md guidance</li><li>Editorial revision</li><li>Optional style check</li><li>Revised text</li>
        </ol>
        <h2>Engineering decisions and limits</h2>
        <p>The skill includes language-specific guidance for English, Russian, German, Spanish and French. Its Python checker uses the standard library, runs offline and makes no model calls.</p>
        <p>The checker measures surface patterns and uses heuristics. It cannot determine authorship or replace editorial review.</p>
