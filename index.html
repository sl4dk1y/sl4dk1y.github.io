      const themeBackgrounds = { day: '#FAF7F8', night: '#100D10', sunset: '#FBF5F1', forest: '#F4F7F2', rain: '#F3F6F8' }
      let storedTheme = null
      try { storedTheme = localStorage.getItem('portfolio-theme') } catch {}
      const migratedTheme = storedTheme === 'light' ? 'day' : storedTheme === 'dark' ? 'night' : storedTheme
      const theme = Object.prototype.hasOwnProperty.call(themeBackgrounds, migratedTheme) ? migratedTheme : 'day'
      document.documentElement.dataset.theme = theme
      if (storedTheme !== null && storedTheme !== theme) { try { localStorage.setItem('portfolio-theme', theme) } catch {} }
      document.querySelector('meta[name="theme-color"]').content = themeBackgrounds[theme]
    </script>

        <section class="no-script-section no-script-shell" id="practice"><h2>Engineering practice</h2><p>Examples from public projects include backend reliability, retrieval evaluation and developer tools.</p><article><h3>Backend systems and reliability</h3><p>Keep API boundaries clear, validate inputs, handle failures deliberately, and consider safe data changes, testing, and observability.</p></article><article><h3>Retrieval evaluation</h3><p>The RAG Retrieval Research repository contains saved search runs and Recall@K and nDCG metrics. DEV ablations are separate from TEST results.</p></article><article><h3>Developer tools and agent workflows</h3><p>The public tools cover careful file handling, source-based code explanations and staged checks.</p></article></section>
