    <script>
      const themeBackgrounds = {
        day: '#FAF7F8',
        night: '#100D10',
        sunset: '#FBF5F1',
        forest: '#F4F7F2',
        rain: '#F3F6F8',
      }
      let storedTheme = null
      try {
        storedTheme = localStorage.getItem('portfolio-theme')
      } catch {}
      const migratedTheme = storedTheme === 'light' ? 'day' : storedTheme === 'dark' ? 'night' : storedTheme
      const theme = Object.prototype.hasOwnProperty.call(themeBackgrounds, migratedTheme) ? migratedTheme : 'day'
      document.documentElement.dataset.theme = theme
      if (storedTheme !== null && storedTheme !== theme) {
        try {
          localStorage.setItem('portfolio-theme', theme)
        } catch {}
      }
      document.querySelector('meta[name="theme-color"]').content = themeBackgrounds[theme]
    </script>
